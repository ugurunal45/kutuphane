<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İstatistik Paneli</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>📊 İstatistik Paneli</h1>
    <div id="status" style="color: blue;">Başlatılıyor...</div>
    <div id="error" style="color: red; font-weight: bold;"></div>
    <div style="width: 80%;"><canvas id="readerChart"></canvas></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    // 1. Firebase Ayarları (Kendi bilgilerini buraya yapıştır)
    const firebaseConfig = {
        apiKey: "AIzaSyCbza5NtXIeBv2oPtcAveVPJoNm6xSU25s",
        authDomain: "onlinekutuphanem.firebaseapp.com",
        projectId: "onlinekutuphanem",
        storageBucket: "onlinekutuphanem.firebasestorage.app",
        messagingSenderId: "772703511419",
        appId: "1:772703511419:web:322073bf09ef86a32193de",
        measurementId: "G-NXBFE7JH8Q"
    };

    try {
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        document.getElementById('status').innerText = "Firebase'e bağlandık, veriler çekiliyor...";

        const snap = await getDocs(collection(db, "books"));
        document.getElementById('status').innerText = snap.size + " kitap bulundu, analiz ediliyor...";

        let readerCount = {};
        snap.forEach(doc => {
            const b = doc.data();
            if(b.reader) {
                b.reader.split('/').forEach(n => {
                    const clean = n.trim();
                    if(clean) readerCount[clean] = (readerCount[clean] || 0) + 1;
                });
            }
        });

        document.getElementById('status').innerText = "Grafik çiziliyor...";
        
        new Chart(document.getElementById('readerChart'), {
            type: 'bar',
            data: {
                labels: Object.keys(readerCount),
                datasets: [{ label: 'Okunan Kitap Sayısı', data: Object.values(readerCount), backgroundColor: '#28a745' }]
            }
        });
        document.getElementById('status').innerText = "İşlem tamam!";

    } catch (err) {
        document.getElementById('error').innerText = "HATA: " + err.message;
        console.error(err);
    }
</script>
</body>
</html>
