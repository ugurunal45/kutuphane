<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Gelişmiş İstatistik</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .summary-box { display: flex; gap: 20px; margin-bottom: 20px; }
        .card { flex: 1; background: white; padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; background: white; border-collapse: collapse; border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #007bff; color: white; }
    </style>
</head>
<body>

<div class="summary-box">
    <div class="card"><h3>Kayıtlı Kitap</h3><p id="totalBooks">0</p></div>
    <div class="card"><h3>Yazar Sayısı</h3><p id="totalAuthors">0</p></div>
    <div class="card"><h3>Yayın Evi</h3><p id="totalPubs">0</p></div>
</div>

<table id="statsTable">
    <tr><th>Okuyucu</th><th>Kayıtlı</th><th>Dışarıdan</th><th>Toplam</th></tr>
</table>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = { /* ... AYARLARIN ... */ };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadStats() {
        const booksSnap = await getDocs(collection(db, "books"));
        const manualSnap = await getDocs(collection(db, "manual_reads"));

        let regData = {}, manualData = {}, allReaders = new Set();
        let authors = new Set(), publishers = new Set();

        // 1. Kayıtlı Kitapları İşle
        booksSnap.forEach(doc => {
            const b = doc.data();
            if(b.author) authors.add(b.author);
            if(b.publisher) publishers.add(b.publisher);
            if(b.reader) {
                b.reader.split('/').forEach(n => {
                    const clean = n.trim();
                    if(clean) {
                        regData[clean] = (regData[clean] || 0) + 1;
                        allReaders.add(clean);
                    }
                });
            }
        });

        // 2. Manuel Verileri İşle
        manualSnap.forEach(doc => {
            const m = doc.data();
            manualData[m.name] = (manualData[m.name] || 0) + m.count;
            allReaders.add(m.name);
        });

        // 3. Tabloyu Doldur
        const table = document.getElementById('statsTable');
        Array.from(allReaders).forEach(reader => {
            const reg = regData[reader] || 0;
            const ext = manualData[reader] || 0;
            const row = `<tr><td>${reader}</td><td>${reg}</td><td>${ext}</td><td><b>${reg + ext}</b></td></tr>`;
            table.innerHTML += row;
        });

        // 4. Özetleri Yaz
        document.getElementById('totalBooks').innerText = booksSnap.size;
        document.getElementById('totalAuthors').innerText = authors.size;
        document.getElementById('totalPubs').innerText = publishers.size;
    }
    loadStats();
</script>
</body>
</html>
