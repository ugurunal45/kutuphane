<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kütüphane İstatistikleri</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .chart-wrapper { position: relative; height: 350px; width: 100%; margin-bottom: 50px; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .btn-back { background: #555; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn-back:hover { background: #333; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Kütüphane Veri Analizi</h1>
    <button class="btn-back" onclick="window.location.href='index.html'">Geri Dön</button>
    
    <div id="status" style="margin:20px 0; font-weight:bold; color: #555;">Analiz ediliyor...</div>

    <div class="chart-wrapper">
        <h3>Okuyucu Skorları</h3>
        <canvas id="readerChart"></canvas>
    </div>
    
    <div class="chart-wrapper">
        <h3>Yayın Evi Dağılımı</h3>
        <canvas id="pubChart"></canvas>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyCbza5NtXIeBv2oPtcAveVPJoNm6xSU25s",
        authDomain: "onlinekutuphanem.firebaseapp.com",
        projectId: "onlinekutuphanem",
        storageBucket: "onlinekutuphanem.firebasestorage.app",
        messagingSenderId: "772703511419",
        appId: "1:772703511419:web:322073bf09ef86a32193de",
        measurementId: "G-NXBFE7JH8Q"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadStats() {
        const snap = await getDocs(collection(db, "books"));
        let pubCount = {}, readerCount = {};

        snap.forEach(doc => {
            const b = doc.data();
            if(b.publisher) pubCount[b.publisher] = (pubCount[b.publisher] || 0) + 1;
            if(b.reader) {
                b.reader.split('/').forEach(n => {
                    const clean = n.trim();
                    if(clean) readerCount[clean] = (readerCount[clean] || 0) + 1;
                });
            }
        });

        document.getElementById('status').innerText = "Grafikler oluşturuldu.";

        // Grafik Seçenekleri (Responsive)
        const commonOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'top' } }
        };

        // Okuyucu Grafiği (Bar)
        new Chart(document.getElementById('readerChart'), {
            type: 'bar',
            data: {
                labels: Object.keys(readerCount),
                datasets: [{ 
                    label: 'Okunan Kitap Sayısı', 
                    data: Object.values(readerCount), 
                    backgroundColor: '#4e73df' 
                }]
            },
            options: commonOptions
        });

        // Yayınevi Grafiği (Pie)
        new Chart(document.getElementById('pubChart'), {
            type: 'pie',
            data: {
                labels: Object.keys(pubCount),
                datasets: [{ 
                    data: Object.values(pubCount), 
                    backgroundColor: ['#ff6384', '#36a2eb', '#ffce56', '#4bc0c0', '#9966ff'] 
                }]
            },
            options: commonOptions
        });
    }
    loadStats();
</script>
</body>
</html>
