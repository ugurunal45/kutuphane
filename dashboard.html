<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = { 
        /* Senin Firebase ayarların */ 
        apiKey: "AIzaSyCbza5NtXIeBv2oPtcAveVPJoNm6xSU25s",
        authDomain: "onlinekutuphanem.firebaseapp.com",
        projectId: "onlinekutuphanem",
        storageBucket: "onlinekutuphanem.firebasestorage.app",
        messagingSenderId: "772703511419",
        appId: "1:772703511419:web:322073bf09ef86a32193de",
        measurementId: "G-NXBFE7JH8Q"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadStats() {
        const status = document.getElementById('status');
        try {
            status.innerText = "Firebase'e bağlanılıyor...";
            const querySnapshot = await getDocs(collection(db, "books"));
            
            if (querySnapshot.empty) {
                status.innerText = "Veritabanında hiç kitap bulunamadı.";
                return;
            }

            status.innerText = "Veriler analiz ediliyor...";
            let pubCount = {}, readerCount = {};

            querySnapshot.forEach(doc => {
                const b = doc.data();
                if(b.publisher) pubCount[b.publisher] = (pubCount[b.publisher] || 0) + 1;
                if(b.reader) {
                    b.reader.split('/').forEach(n => {
                        const clean = n.trim();
                        if(clean) readerCount[clean] = (readerCount[clean] || 0) + 1;
                    });
                }
            });

            // Sıralama
            const sortObj = (obj) => Object.entries(obj).sort((a, b) => b[1] - a[1]);
            const sortedReaders = sortObj(readerCount);
            const sortedPubs = sortObj(pubCount);

            status.innerText = "Analiz tamamlandı.";

            // Grafik 1
            new Chart(document.getElementById('readerChart'), {
                type: 'bar',
                data: {
                    labels: sortedReaders.map(x => x[0]),
                    datasets: [{ label: 'Okunan Kitap Sayısı', data: sortedReaders.map(x => x[1]), backgroundColor: '#28a745' }]
                }
            });

            // Grafik 2
            new Chart(document.getElementById('pubChart'), {
                type: 'pie',
                data: {
                    labels: sortedPubs.map(x => x[0]),
                    datasets: [{ data: sortedPubs.map(x => x[1]), backgroundColor: ['#007bff', '#ffc107', '#dc3545', '#17a2b8', '#6c757d'] }]
                }
            });

        } catch (error) {
            status.innerHTML = "<b style='color:red;'>HATA: " + error.message + "</b>";
            console.error("Firebase Hatası:", error);
        }
    }
    loadStats();
</script>
