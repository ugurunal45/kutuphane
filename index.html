<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kişisel Kütüphanem</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
.container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
.view { display: none; }
.active { display: block; }
input { width: 100%; padding: 12px; margin: 8px 0; }
button { background: #007bff; color: white; padding: 10px; border: none; margin-right:5px; cursor:pointer;}
.nav-btn { background:#6c757d; }
table { width:100%; margin-top:20px; border-collapse: collapse;}
td, th { border:1px solid #ddd; padding:10px;}
#adminPanel { display:none; background:#fff3cd; padding:15px; margin-top:15px;}
</style>
</head>

<body>

<div class="container">
<h1>📚 Kütüphanem</h1>

<div id="authSection">
<input type="email" id="email" placeholder="E-posta">
<input type="password" id="password" placeholder="Şifre">
<button onclick="login()">Giriş Yap</button>
</div>

<div id="menuSection" style="display:none;">
<button class="nav-btn" onclick="showView('libraryView')">Kütüphane</button>
<button class="nav-btn" onclick="showView('statsView')">İstatistik</button>
<button onclick="logout()" style="background:red;">Çıkış</button>
</div>

<div id="libraryView" class="view">

<input type="text" id="searchInput" placeholder="Kitap ara..." oninput="debouncedSearch()">

<div id="status"></div>

<table>
<thead>
<tr><th>ISBN</th><th>Kitap</th><th>Yazar</th><th>Yayınevi</th><th>Okuyan</th></tr>
</thead>
<tbody id="bookList"></tbody>
</table>

</div>

<div id="statsView" class="view">
<button onclick="calculateStats()">Verileri Analiz Et</button>
<div id="statsContent"></div>
</div>

<div id="adminPanel">
<h3>Excel Yükle</h3>
<input type="file" id="excelFile">
<button onclick="uploadExcel()">Yükle</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, query, where, orderBy, startAt, endAt, limit } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyCbza5NtXIeBv2oPtcAveVPJoNm6xSU25s",
authDomain: "onlinekutuphanem.firebaseapp.com",
projectId: "onlinekutuphanem",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// VIEW
window.showView = (id)=>{
document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
document.getElementById(id).classList.add('active');
};

// AUTH
window.login = () => {
    const emailVal = document.getElementById('email').value;
    const passVal = document.getElementById('password').value;

    signInWithEmailAndPassword(auth, emailVal, passVal)
    .catch(e => {
        alert("Hata: " + e.message);
        console.error(e);
    });
};
window.logout = ()=> signOut(auth);

// DEBOUNCE
let t;
window.debouncedSearch = ()=>{
clearTimeout(t);
t = setTimeout(()=> searchBooks(),300);
};

// 🔍 ARAMA (OPTİMİZE)
window.searchBooks = async ()=>{
const val = document.getElementById("searchInput").value.trim().toLowerCase('tr-TR');
const list = document.getElementById("bookList");
const status = document.getElementById("status");

list.innerHTML="";
if(!val) return;

status.innerText="Aranıyor...";

let q;

if(!isNaN(val)){
// ISBN
q = query(collection(db,"books"), where("isbn","==",val));
}else{
// TITLE
q = query(
collection(db,"books"),
orderBy("title_lower")
startAt(val),
endAt(val+"\uf8ff"),
limit(20)
);
}

const snap = await getDocs(q);

if(snap.empty){
list.innerHTML="<tr><td colspan='5'>Bulunamadı</td></tr>";
}else{
snap.forEach(doc=>{
const b = doc.data();
list.innerHTML += `
<tr>
<td>${b.isbn||""}</td>
<td>${b.title}</td>
<td>${b.author}</td>
<td>${b.publisher}</td>
<td>${b.reader||""}</td>
</tr>`;
});
}

status.innerText="";
};

// 📊 İSTATİSTİK
window.calculateStats = async ()=>{
const snap = await getDocs(collection(db,"books"));
let readerCount = {};

snap.forEach(doc=>{
const b = doc.data();
if(b.reader){
b.reader.split('/').forEach(n=>{
n = n.trim();
if(n) readerCount[n] = (readerCount[n]||0)+1;
});
}
});

let html="<h3>Okuyucu Skor</h3><ul>";
for(let r in readerCount){
html+=`<li>${r}: ${readerCount[r]}</li>`;
}
html+="</ul>";

statsContent.innerHTML=html;
};

// 📥 EXCEL YÜKLE (OPTİMİZE)
window.uploadExcel = ()=>{
const file = excelFile.files[0];
const reader = new FileReader();

reader.onload = async (e)=>{
const data = new Uint8Array(e.target.result);
const wb = XLSX.read(data,{type:'array'});
const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});

for(let i=1;i<rows.length;i++){
const r = rows[i];

await addDoc(collection(db,"books"),{
isbn: String(r[0]||""),
title: String(r[1]||""),
title_lower: String(r[1]||"").toLowerCase('tr-TR'),
author: String(r[2]||""),
publisher: String(r[3]||""),
reader: String(r[4]||"")
});
}

alert("Yüklendi");
};

reader.readAsArrayBuffer(file);
};

// AUTH STATE
onAuthStateChanged(auth,(user)=>{
if(user){
authSection.style.display="none";
menuSection.style.display="block";
showView('libraryView');

if(user.email==="admin@unallar.com.tr"){
adminPanel.style.display="block";
}
}else{
authSection.style.display="block";
menuSection.style.display="none";
}
});

</script>
</body>
</html>
