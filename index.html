<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCbza5NtXIeBv2oPtcAveVPJoNm6xSU25s",
        authDomain: "onlinekutuphanem.firebaseapp.com",
        projectId: "onlinekutuphanem",
        storageBucket: "onlinekutuphanem.firebasestorage.app",
        messagingSenderId: "772703511419",
        appId: "1:772703511419:web:322073bf09ef86a32193de",
        measurementId: "G-NXBFE7JH8Q"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let allBooks = []; // Kütüphanedeki tüm kitapların hafızası

    window.showView = (id) => {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };

    window.login = () => signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value).catch(e => alert(e.message));
    window.logout = () => signOut(auth);

    // KİTAPLARI YÜKLE (Tüm işlemlerin temeli)
    window.loadBooks = async () => {
        document.getElementById('status').innerText = "Veritabanından kitaplar çekiliyor...";
        const snap = await getDocs(collection(db, "books"));
        allBooks = [];
        snap.forEach(d => allBooks.push({ id: d.id, ...d.data() }));
        renderTable(allBooks);
        document.getElementById('status').innerText = allBooks.length + " kitap yüklendi.";
    };

    // ARAMA FONKSİYONU (Otomatik veri çekme kontrolü eklendi)
    window.searchBooks = async () => {
        // Eğer veriler yüklenmemişse önce yükle
        if (allBooks.length === 0) await loadBooks();

        const filter = document.getElementById('searchInput').value.toLocaleLowerCase('tr-TR');
        const filtered = allBooks.filter(b => 
            (b.title || "").toLocaleLowerCase('tr-TR').includes(filter) || 
            (b.isbn || "").includes(filter)
        );
        renderTable(filtered);
        document.getElementById('status').innerText = filtered.length + " sonuç bulundu.";
    };

    // İSTATİSTİK FONKSİYONU (Otomatik veri çekme kontrolü eklendi)
    window.calculateStats = async () => {
        // Eğer veriler yüklenmemişse önce yükle
        if (allBooks.length === 0) await loadBooks();

        const content = document.getElementById('statsContent');
        let pubCount = {}, authCount = {}, readerCount = {};

        allBooks.forEach(b => {
            if(b.publisher) pubCount[b.publisher] = (pubCount[b.publisher] || 0) + 1;
            if(b.reader) {
                b.reader.split('/').forEach(name => {
                    const clean = name.trim();
                    if(clean) readerCount[clean] = (readerCount[clean] || 0) + 1;
                });
            }
        });

        let html = `<h4>Okuyucu Skorları:</h4><ul>`;
        for(let r in readerCount) html += `<li><strong>${r}:</strong> ${readerCount[r]} kitap</li>`;
        html += `</ul><h4>Yayın Evi Dağılımı:</h4><ul>`;
        for(let p in pubCount) html += `<li>${p}: ${pubCount[p]} adet</li>`;
        content.innerHTML = html;
    };

    // TABLO ÇİZİMİ
    function renderTable(data) {
        const list = document.getElementById('bookList');
        list.innerHTML = data.map(b => `
            <tr>
                <td>${b.isbn || ''}</td>
                <td>${b.title || ''}</td>
                <td>${b.author || ''}</td>
                <td>${b.publisher || ''}</td>
                <td>${b.reader || ''}</td>
                <td><button class="btn-edit" onclick="editReader('${b.id}', '${b.reader || ''}')">Düzenle</button></td>
            </tr>`).join('');
    }

    // DÜZENLEME
    window.editReader = async (id, currentReader) => {
        const newReader = prompt("Yeni okuyucu ismini girin:", currentReader);
        if (newReader !== null) {
            await updateDoc(doc(db, "books", id), { reader: newReader });
            await loadBooks(); // Listeyi güncelle
            alert("Güncellendi!");
        }
    };

    window.uploadExcel = () => {
        const file = document.getElementById('excelFile').files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, {type: 'array'});
            const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1});
            for(let i = 1; i < json.length; i++) {
                const r = json[i];
                if(r[1]) await addDoc(collection(db, "books"), { isbn: String(r[0]||""), title: String(r[1]||""), author: String(r[2]||""), publisher: String(r[3]||""), reader: String(r[4]||"") });
            }
            alert("Yükleme tamamlandı!");
            loadBooks();
        };
        reader.readAsArrayBuffer(file);
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('menuSection').style.display = 'block';
            showView('libraryView');
            if(user.email === "admin@unallar.com.tr") document.getElementById('adminPanel').style.display = 'block'; 
        } else {
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('menuSection').style.display = 'none';
        }
    });
</script>
