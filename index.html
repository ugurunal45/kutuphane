<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kütüphane Yönetimi</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .view { display: none; } .active { display: block; }
        input { padding: 12px; margin: 5px 0; border: 1px solid #ddd; border-radius: 6px; width: 100%; box-sizing: border-box; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 6px; background: #007bff; color: white; font-weight: bold; }
        .admin-section { background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #eee; margin-bottom: 25px; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .search-sticky { position: sticky; top: 0; background: white; padding: 15px 0; z-index: 100; border-bottom: 2px solid #eee; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: left; font-size: 14px; word-wrap: break-word; }
        th { background: #f8f9fa; position: sticky; top: 85px; z-index: 90; }
        .btn-edit { background: #ffc107; color: black; padding: 5px 10px; font-size: 12px; border-radius: 4px; border:none; cursor:pointer; }
        .btn-success { background: #28a745; width: 100%; }
        
        /* Düzenleme Modalı için CSS */
        .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 10% auto; padding: 20px; border-radius: 10px; width: 80%; max-width: 500px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
        .btn-cancel { background: #6c757d; }
    </style>
</head>
<body>

<div class="container">
    <div id="authSection">
        <h2 style="text-align:center;">📚 Giriş Yap</h2>
        <input type="email" id="email" placeholder="E-posta">
        <input type="password" id="password" placeholder="Şifre">
        <button onclick="login()" style="width:100%; margin-top:10px;">Giriş Yap</button>
    </div>

    <div id="menuSection" class="view">
        <div style="margin-bottom: 20px; display: flex; justify-content: space-between; gap: 10px;">
            <div>
                <button onclick="window.location.href='dashboard.html'" style="background: #6c757d;">📊 İstatistikler</button>
                <button onclick="exportAllToCSV()" style="background: #17a2b8; margin-left: 5px;">📥 Verileri İndir</button>
            </div>
            <button onclick="logout()" style="background:#dc3545;">Çıkış Yap</button>
        </div>

        <div id="adminPanel" style="display:none;">
            <div class="admin-section">
                <h3>➕ Yeni Kitap Ekle</h3>
                <div class="admin-grid">
                    <input type="text" id="m_isbn" placeholder="ISBN Numarası">
                    <input type="text" id="m_title" placeholder="Kitap Adı">
                    <input type="text" id="m_author" placeholder="Yazar" list="authorsList">
                    <input type="text" id="m_publisher" placeholder="Yayın Evi" list="publishersList">
                </div>
                <input type="text" id="m_reader" placeholder="Okuyan Kişi">
                <button onclick="saveManualBook()" class="btn-success">Kaydet</button>
            </div>
            <datalist id="authorsList"></datalist>
            <datalist id="publishersList"></datalist>
        </div>

        <div class="search-sticky">
            <input type="text" id="searchInput" placeholder="Aramak istediğiniz kelimeyi yazın..." oninput="debounceSearch()">
            <div id="status" style="font-size: 13px; color: #666; font-weight: bold; margin-top: 5px;">Bağlanıyor...</div>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 15%;">ISBN</th>
                    <th style="width: 30%;">Kitap Adı</th>
                    <th style="width: 20%;">Yazar</th>
                    <th style="width: 15%;">Yayınevi</th>
                    <th style="width: 10%;">Okuyan</th>
                    <th style="width: 10%;">İşlem</th>
                </tr>
            </thead>
            <tbody id="bookList"></tbody>
        </table>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top: 0;">📖 Kitap Bilgilerini Düzenle</h3>
        <input type="hidden" id="edit_id">
        
        <label style="font-size: 12px; font-weight: bold; margin-top: 5px; display: block;">ISBN:</label>
        <input type="text" id="edit_isbn">
        
        <label style="font-size: 12px; font-weight: bold; margin-top: 5px; display: block;">Kitap Adı:</label>
        <input type="text" id="edit_title">
        
        <label style="font-size: 12px; font-weight: bold; margin-top: 5px; display: block;">Yazar:</label>
        <input type="text" id="edit_author">
        
        <label style="font-size: 12px; font-weight: bold; margin-top: 5px; display: block;">Yayınevi:</label>
        <input type="text" id="edit_publisher">
        
        <label style="font-size: 12px; font-weight: bold; margin-top: 5px; display: block;">Okuyan Kişi:</label>
        <input type="text" id="edit_reader">
        
        <div class="modal-buttons">
            <button onclick="closeEditModal()" class="btn-cancel">İptal</button>
            <button onclick="saveBookEdit()" class="btn-success" style="width: auto;">Değişiklikleri Kaydet</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, where, doc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCbza5NtXIeBv2oPtcAveVPJoNm6xSU25s",
        authDomain: "onlinekutuphanem.firebaseapp.com",
        projectId: "onlinekutuphanem",
        storageBucket: "onlinekutuphanem.firebasestorage.app",
        messagingSenderId: "772703511419",
        appId: "1:772703511419:web:322073bf09ef86a32193de"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let allBooks = [];
    let searchTimer;

    window.login = () => {
        signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value).catch(e => alert(e.message));
    };
    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('menuSection').classList.add('active');
            if(user.email === "admin@unallar.com.tr") document.getElementById('adminPanel').style.display = 'block';
            preloadData();
        }
    });

    async function preloadData() {
        const snap = await getDocs(collection(db, "books"));
        allBooks = [];
        const authors = new Set(), publishers = new Set();
        snap.forEach(d => {
            const data = { id: d.id, ...d.data() };
            allBooks.push(data);
            if(data.author) authors.add(data.author);
            if(data.publisher) publishers.add(data.publisher);
        });
        document.getElementById('authorsList').innerHTML = Array.from(authors).map(a => `<option value="${a}">`).join('');
        document.getElementById('publishersList').innerHTML = Array.from(publishers).map(p => `<option value="${p}">`).join('');
        document.getElementById('status').innerText = "✅ " + allBooks.length + " kitap yüklendi.";

        const urlParams = new URLSearchParams(window.location.search);
        const searchParam = urlParams.get('search');
        if (searchParam) {
            document.getElementById('searchInput').value = decodeURIComponent(searchParam);
            debounceSearch();
        }
    }

    window.debounceSearch = () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            const term = document.getElementById('searchInput').value.toLocaleLowerCase('tr-TR').trim();
            const list = document.getElementById('bookList');
            if(term.length < 2) { list.innerHTML = ""; return; }

            const filtered = allBooks.filter(b => 
                (b.title || "").toLocaleLowerCase('tr-TR').includes(term) || 
                (b.isbn || "").includes(term) ||
                (b.author || "").toLocaleLowerCase('tr-TR').includes(term) ||
                (b.publisher || "").toLocaleLowerCase('tr-TR').includes(term) ||
                (b.reader || "").toLocaleLowerCase('tr-TR').includes(term)
            ).slice(0, 50);

            list.innerHTML = filtered.map(b => `
                <tr>
                    <td>${b.isbn || ''}</td>
                    <td><b>${b.title}</b></td>
                    <td>${b.author || ''}</td>
                    <td>${b.publisher || ''}</td>
                    <td>${b.reader || ''}</td>
                    <td><button class="btn-edit" onclick="openEditModal('${b.id}')">Düzenle</button></td>
                </tr>`).join('');
        }, 300);
    };

    window.openEditModal = (id) => {
        const book = allBooks.find(b => b.id === id);
        if (book) {
            document.getElementById('edit_id').value = book.id;
            document.getElementById('edit_isbn').value = book.isbn || '';
            document.getElementById('edit_title').value = book.title || '';
            document.getElementById('edit_author').value = book.author || '';
            document.getElementById('edit_publisher').value = book.publisher || '';
            document.getElementById('edit_reader').value = book.reader || '';
            document.getElementById('editModal').style.display = 'block';
        }
    };

    window.closeEditModal = () => {
        document.getElementById('editModal').style.display = 'none';
    };

    window.saveBookEdit = async () => {
        const id = document.getElementById('edit_id').value;
        const isbn = document.getElementById('edit_isbn').value.trim();
        const title = document.getElementById('edit_title').value.trim();
        const author = document.getElementById('edit_author').value.trim();
        const publisher = document.getElementById('edit_publisher').value.trim();
        const reader = document.getElementById('edit_reader').value.trim();

        if(!title) return alert("Kitap adı boş bırakılamaz!");

        try {
            if(isbn) {
                const existingBook = allBooks.find(b => b.isbn === isbn && b.id !== id);
                if(existingBook) {
                    return alert("Bu ISBN numarası zaten başka bir kitaba kayıtlı!");
                }
            }

            await updateDoc(doc(db, "books", id), {
                isbn: isbn,
                title: title,
                author: author,
                publisher: publisher,
                reader: reader
            });

            alert("Kitap başarıyla güncellendi!");
            closeEditModal();
            location.reload();
        } catch (error) {
            console.error("Güncelleme hatası:", error);
            alert("Bir hata oluştu güncellenemedi.");
        }
    };

    window.saveManualBook = async () => {
        const isbn = document.getElementById('m_isbn').value.trim();
        const title = document.getElementById('m_title').value.trim();
        if(!title) return alert("Kitap adı giriniz!");
        if(isbn) {
            const q = query(collection(db, "books"), where("isbn", "==", isbn));
            const check = await getDocs(q);
            if(!check.empty) return alert("Bu ISBN zaten kayıtlı!");
        }
        await addDoc(collection(db, "books"), {
            isbn, title, 
            author: document.getElementById('m_author').value,
            publisher: document.getElementById('m_publisher').value,
            reader: document.getElementById('m_reader').value
        });
        alert("Eklendi!");
        location.reload();
    };

    // DOĞRUDAN CSV AKTARIP İNDİRME FONKSİYONU
    window.exportAllToCSV = async () => {
        if (allBooks.length === 0) {
            return alert("İndirilecek kitap verisi bulunamadı! Lütfen verilerin yüklenmesini bekleyin.");
        }

        try {
            const statusBtn = document.querySelector("button[onclick='exportAllToCSV()']");
            const originalText = statusBtn.innerText;
            statusBtn.innerText = "⏳ Hazırlanıyor...";
            statusBtn.disabled = true;

            // Ödünç Verilerini de Firebase'den çekelim
            const loanSnap = await getDocs(collection(db, "odun"));
            let allLoans = [];
            loanSnap.forEach(doc => {
                allLoans.push({ id: doc.id, ...doc.data() });
            });

            // 1. DOSYA: KİTAPLAR LİSTESİ (Çift tırnak ve noktalı virgül korumalı)
            const bookHeaders = ["ID", "ISBN", "Kitap Adi", "Yazar", "Yayinevi", "Okuyan Kisi"];
            const bookRows = allBooks.map(b => [
                b.id || "",
                b.isbn || "",
                b.title || "",
                b.author || "",
                b.publisher || "",
                b.reader || ""
            ]);
            downloadCSV("kitaplar_listesi.csv", bookHeaders, bookRows);

            // 2. DOSYA: ÖDÜNÇ LİSTESİ (Varsa indirmeyi gecikmeli tetikliyoruz)
            if (allLoans.length > 0) {
                const loanHeaders = ["ID", "Okuyucu Adi", "Sayi", "Son Islem Tarihi"];
                const loanRows = allLoans.map(l => {
                    let tarihStr = "";
                    if (l.tarih) {
                        const t = l.tarih.seconds ? new Date(l.tarih.seconds * 1000) : new Date(l.tarih);
                        tarihStr = t.toLocaleString('tr-TR');
                    }
                    return [
                        l.id || "",
                        l.okuyucu || "",
                        l.sayi || 0,
                        tarihStr
                    ];
                });
                
                setTimeout(() => {
                    downloadCSV("odunc_listesi.csv", loanHeaders, loanRows);
                }, 800);
            }

            statusBtn.innerText = originalText;
            statusBtn.disabled = false;
            alert("✅ İndirme işlemi başladı! Tarayıcınız çoklu indirmeyi engellerse lütfen adres çubuğunun yanındaki uyarıdan 'İzin ver' seçeneğini seçiniz.");

        } catch (error) {
            console.error("Aktarım hatası:", error);
            alert("Veriler indirilirken bir hata oluştu.");
            const statusBtn = document.querySelector("button[onclick='exportAllToCSV()']");
            statusBtn.innerText = "📥 Verileri İndir";
            statusBtn.disabled = false;
        }
    };

    function downloadCSV(filename, headers, rows) {
        let csvContent = headers.join(";") + "\n";
        
        rows.forEach(row => {
            const cleanedRow = row.map(val => {
                let strVal = String(val).replace(/"/g, '""');
                if (strVal.includes(";") || strVal.includes('"') || strVal.includes("\n")) {
                    strVal = `"${strVal}"`;
                }
                return strVal;
            });
            csvContent += cleanedRow.join(";") + "\n";
        });

        // Türkçe karakterlerin Excel üzerinde kusursuz okunabilmesi için UTF-8 BOM eklenmiştir.
        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", filename);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
</html>
