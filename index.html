<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişisel Kütüphanem</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: left; }
        #adminPanel { display: none; background: #f8f9fa; padding: 20px; border-radius: 6px; margin-top: 20px; border: 1px solid #e9ecef; }
        .bulk-btn { background: #28a745; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 Kütüphanem</h1>
    
    <div id="authSection">
        <input type="email" id="email" placeholder="E-posta">
        <input type="password" id="password" placeholder="Şifre">
        <button onclick="login()">Giriş Yap</button>
    </div>

    <div id="librarySection" style="display:none;">
        <button onclick="logout()" style="background:#dc3545;">Çıkış Yap</button>
        <hr>
        <input type="text" id="searchInput" placeholder="Kitap, Yazar, Yayın Evi veya Okuyan ara..." onkeyup="searchBooks()">
        
        <table id="bookTable">
            <thead><tr><th>Kitap Adı</th><th>Yazar</th><th>Yayın Evi</th><th>Okuyan</th></tr></thead>
            <tbody id="bookList"></tbody>
        </table>

        <div id="adminPanel">
            <h3>Kitap Ekle (Admin)</h3>
            <input type="text" id="newTitle" placeholder="Kitap Adı">
            <input type="text" id="newAuthor" placeholder="Yazar">
            <input type="text" id="newPub" placeholder="Yayın Evi">
            <input type="text" id="newReader" placeholder="Okuyanlar (örn: Mehmet/Mustafa)">
            <button onclick="addBook()">Kitabı Ekle</button>
            
            <hr>
            <h3>Toplu Yükleme (Excel'den Kopyala-Yapıştır)</h3>
            <p><small>Excel'de "Kitap, Yazar, Yayın Evi, Okuyan" sırasıyla seçip buraya yapıştırın:</small></p>
            <textarea id="bulkData" rows="5" placeholder="Excel satırlarını buraya yapıştırın..."></textarea>
            <button class="bulk-btn" onclick="uploadBulk()">Toplu Ekle</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCbza5NtXIeBv2oPtcAveVPJoNm6xSU25s",
        authDomain: "onlinekutuphanem.firebaseapp.com",
        projectId: "onlinekutuphanem",
        storageBucket: "onlinekutuphanem.firebasestorage.app",
        messagingSenderId: "772703511419",
        appId: "1:772703511419:web:322073bf09ef86a32193de",
        measurementId: "G-NXBFE7JH8Q"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    window.login = () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        signInWithEmailAndPassword(auth, email, pass).catch(e => alert("Hata: " + e.message));
    };

    window.logout = () => signOut(auth);

    window.addBook = async () => {
        await addDoc(collection(db, "books"), {
            title: document.getElementById('newTitle').value,
            author: document.getElementById('newAuthor').value,
            publisher: document.getElementById('newPub').value,
            reader: document.getElementById('newReader').value
        });
        alert("Kitap eklendi!");
        loadBooks();
    };

    window.uploadBulk = async () => {
        const data = document.getElementById('bulkData').value;
        const rows = data.split('\n');
        if(!confirm(rows.length + " adet kitap eklemek istediğine emin misin?")) return;

        for(let row of rows) {
            const cols = row.split('\t');
            if(cols.length >= 3) {
                await addDoc(collection(db, "books"), {
                    title: cols[0],
                    author: cols[1],
                    publisher: cols[2],
                    reader: cols[3] || ""
                });
            }
        }
        alert("Toplu işlem tamamlandı!");
        loadBooks();
    };

    async function loadBooks() {
        const querySnapshot = await getDocs(collection(db, "books"));
        const list = document.getElementById('bookList');
        list.innerHTML = "";
        querySnapshot.forEach(doc => {
            const b = doc.data();
            list.innerHTML += `<tr><td>${b.title}</td><td>${b.author}</td><td>${b.publisher}</td><td>${b.reader}</td></tr>`;
        });
    }

    window.searchBooks = () => {
        const filter = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.getElementById('bookList').getElementsByTagName('tr');
        for (let i = 0; i < rows.length; i++) {
            rows[i].style.display = rows[i].innerText.toLowerCase().includes(filter) ? "" : "none";
        }
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('librarySection').style.display = 'block';
            // BURAYI KENDİ E-POSTAN İLE DEĞİŞTİR
            if(user.email === "admin@unallar.com.tr") { 
                document.getElementById('adminPanel').style.display = 'block'; 
            }
            loadBooks();
        } else {
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('librarySection').style.display = 'none';
        }
    });
</script>
</body>
</html>
